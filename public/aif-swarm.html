<script>
const CASE={
  id:"AIF/TG/2026/03417",name:"Sri Lakshmi Agro Producer Company Ltd",project:"4 TPH rice mill expansion",
  location:"Karimnagar, Telangana",request:"₹72.50 L",cost:"₹1.20 Cr",members:"520 farmer-members",
  pan:"AAGCS4471Q",gstin:"36AAGCS4471Q1Z8",vintage:"6 years",offtake:"Telangana custom-milling allotment"
};
const TABS=[
  ["summary","Summary"],["investigation","Investigation"],["findings","Findings"],["appraisal","Appraisal"],
  ["decision","Decision"],["audit","Audit"]
];
const WORKSTREAMS=[
  {name:"Eligibility & scheme",scope:"AIF eligibility, permitted use, official rule version",result:"Verified",kind:"green",time:"00:08"},
  {name:"Entity KYC & AML",scope:"Company, UBOs, directors, sanctions and PEP screening",result:"Verified",kind:"green",time:"00:16"},
  {name:"Bureau & liabilities",scope:"Four CICs reconciled against declared obligations",result:"1 review",kind:"amber",time:"00:22"},
  {name:"Financial integrity",scope:"Bank, GST and ITR reconciliation; related-party paths",result:"Referral required",kind:"red",time:"00:41"},
  {name:"Security & legal",scope:"Title chain, EC, CERSAI, valuation and prior charges",result:"2 reviews",kind:"amber",time:"00:53"},
  {name:"Technical appraisal",scope:"Capacity, CMR economics, quotations and sensitivities",result:"Complete",kind:"green",time:"01:07"},
  {name:"Policy & risk",scope:"DSCR, security cover, PD/LGD and policy exceptions",result:"Complete",kind:"green",time:"01:12"}
];
const FINDINGS=[
  {id:"roundtrip",rank:"01",kind:"red",title:"Circular fund movement requires FCU review",desc:"₹41.0 L moved Operating A → Related Entity B → Operating A within seven days. Confidence is 0.58, below the 0.85 classification threshold; no fraud conclusion has been made.",source:"AA bank statements",status:"Critical referral"},
  {id:"bureau",rank:"02",kind:"amber",title:"Four-bureau liability differs from application",desc:"Two facilities totalling ₹6.0 L appear in CRIF and Experian but were not declared. Revised debt service remains included in the appraisal.",source:"CIBIL · CRIF · Experian · Equifax",status:"Officer review"},
  {id:"title",rank:"03",kind:"amber",title:"Title chain has a four-year documentary gap",desc:"The 1998–2002 link document is unavailable. Final marketability opinion and risk treatment remain with the panel advocate and credit officer.",source:"Telangana ROR · registration records",status:"Legal review"},
  {id:"charge",rank:"04",kind:"amber",title:"Prior SBI charge must be satisfied",desc:"CERSAI shows an existing charge over Survey 247. NOC and satisfaction are required before any fresh security perfection.",source:"CERSAI search",status:"Pre-disbursement block"}
];
const EVIDENCE={
  roundtrip:{title:"Circular fund movement",sub:"Bank statement evidence · no automated fraud classification",rows:[["Debit · Operating A","₹41.00 L · 12 Jun 2026"],["Credit · Related Entity B","₹41.00 L · 12 Jun 2026"],["Return credit · Operating A","₹40.72 L · 18 Jun 2026"],["Common director match","1 of 3 directors"],["Pattern confidence","0.58 · below 0.85 threshold"],["System action","Refer to Fraud Control Unit"]],source:"Account Aggregator · 3 linked accounts",consent:"AA-CONS-SYN-88F2",event:"EVT-2026-03417-044"},
  bureau:{title:"Multi-bureau liability reconciliation",sub:"Facilities matched across four credit information companies",rows:[["Declared liabilities","₹10.00 L"],["Reconciled liabilities","₹16.00 L"],["Muthoot facility","₹2.00 L · Experian"],["Co-operative facility","₹4.00 L · CRIF"],["Revised DSCR","1.48× · includes both EMIs"],["System action","Officer confirmation required"]],source:"Four-CIC synthetic response set",consent:"Permissible-purpose pull · simulated",event:"EVT-2026-03417-026"},
  title:{title:"Title continuity review",sub:"Panel advocate work item · final opinion not automated",rows:[["Property","Survey 247 · Karimnagar"],["Extent","2.40 acres"],["Current holder",CASE.name],["Chain reviewed","1988–2026"],["Missing link","1998–2002"],["System action","Route for panel advocate opinion"]],source:"Synthetic Telangana land and registration records",consent:"Borrower consent · simulated",event:"EVT-2026-03417-051"},
  charge:{title:"CERSAI charge search",sub:"Security perfection dependency",rows:[["Asset","Survey 247 · land and building"],["Charge holder","State Bank of India"],["Charge status","Open in source response"],["Proposed action","Obtain NOC and file satisfaction"],["New charge","Blocked until satisfaction"],["Owner","Credit operations"]],source:"Synthetic CERSAI search response",consent:"Permissible-purpose search · simulated",event:"EVT-2026-03417-055"},
  audit:{title:"Decision provenance",sub:"Evidence-to-action reconstruction",rows:[["Source event","EVT-2026-03417-044"],["Extracted fact","₹41.0 L circular path"],["Confidence","0.58"],["Policy rule","Integrity finding cannot be auto-classified"],["System state","Recommendation withheld"],["Human action","FCU referral recorded"]],source:"Finclus synthetic audit ledger",consent:"Internal control event",event:"EVT-2026-03417-073"}
};
const state={screen:"applications",investigated:false,running:false,completed:0,referred:false,stress:"base"};
const icons={
  lock:'<span class="lock">●</span>',
  arrow:'<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></svg>',
  stop:'<svg viewBox="0 0 24 24"><path d="M7 7h10v10H7z"/></svg>'
};
function caseHeader(){
  const status=state.referred?'<span class="case-status" style="background:var(--red-soft);color:var(--red)">FCU referred</span>':state.investigated?'<span class="case-status">Decision on hold</span>':'<span class="case-status" style="background:#f2f3f4;color:#666b73">Investigation pending</span>';
  return `<div class="case-summary"><div class="case-logo">SL</div><div class="case-identity"><h2>${CASE.name}</h2><div class="case-meta">${CASE.id} · PAN ${CASE.pan} · GSTIN ${CASE.gstin} · ${CASE.location}</div></div>${status}<div class="case-amount"><b>${CASE.request}</b><span>of ${CASE.cost} project</span></div></div><div class="tabs">${TABS.map(([id,label])=>{const locked=!state.investigated&&!["summary","investigation"].includes(id);return `<button class="tab ${state.screen===id?'active':''}" ${locked?'disabled':''} onclick="goCase('${id}')">${label}${locked?icons.lock:''}</button>`}).join('')}</div>`;
}
function updateChrome(){
  const inCase=!['applications','pilot'].includes(state.screen);
  const head=document.getElementById("caseHead");head.hidden=!inCase;head.innerHTML=inCase?caseHeader():"";
  document.getElementById("breadcrumb").innerHTML=inCase?`Applications &nbsp;›&nbsp; <b>${CASE.id}</b>`:state.screen==='pilot'?`Pilot &nbsp;·&nbsp; <b>AIF Telangana</b>`:`Applications &nbsp;·&nbsp; <b>AIF pipeline</b>`;
  document.querySelectorAll(".nav-item").forEach(x=>x.classList.toggle("active",x.dataset.global==="applications"));
}
function render(){updateChrome();document.getElementById("main").innerHTML=({applications:rApplications,summary:rSummary,investigation:rInvestigation,findings:rFindings,appraisal:rAppraisal,decision:rDecision,audit:rAudit,pilot:rPilot}[state.screen]||rApplications)();document.querySelector(".main").scrollTo(0,0)}
function goGlobal(id){if(id==="applications"){state.screen="applications";render()}else toast(`<b>${id[0].toUpperCase()+id.slice(1)}</b> is outside this focused AIF case demo.`)}
function goCase(id,force=false){if(!state.investigated&&!["summary","investigation"].includes(id)&&!force){toast("Run the investigation before opening downstream decision work.");return}state.screen=id;render()}
function resetDemo(){Object.assign(state,{screen:"applications",investigated:false,running:false,completed:0,referred:false,stress:"base"});render();toast("Demo reset to the AIF application queue.")}
function rApplications(){return `<div class="page"><div class="page-head"><div><div class="eyebrow">AIF applications</div><h1>Applications</h1><p class="lede">Review new files, exceptions and approaching service-level deadlines across the AIF pipeline.</p></div><div class="actions"><button class="btn">Export queue</button><button class="btn primary" onclick="openCase()">Open priority case</button></div></div><div class="metric-row"><div class="metric"><div class="metric-label">Open applications</div><div class="metric-value">12</div><div class="metric-note">₹8.42 Cr requested</div></div><div class="metric"><div class="metric-label">Needs officer review</div><div class="metric-value">3</div><div class="metric-note">1 critical referral</div></div><div class="metric"><div class="metric-label">Within SLA</div><div class="metric-value">91%</div><div class="metric-note">Current AIF queue</div></div><div class="metric"><div class="metric-label">Median queue age</div><div class="metric-value">2.4d</div><div class="metric-note">Synthetic demo data</div></div></div><section class="panel"><div class="panel-head"><h3>AIF application queue</h3><span class="badge gray right">12 open</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Application</th><th>Borrower</th><th>Project</th><th>Request</th><th>Stage</th><th>SLA</th><th></th></tr></thead><tbody><tr class="target" onclick="openCase()" style="cursor:pointer"><td><div class="strong">${CASE.id}</div><div class="mono">Karimnagar · Telangana</div></td><td><div class="strong">${CASE.name}</div><div class="mono">Producer company · 520 members</div></td><td>${CASE.project}</td><td class="strong">${CASE.request}</td><td><span class="badge blue">New · 28 docs</span></td><td><span class="badge green">Day 1 / 7</span></td><td class="row-action">Open →</td></tr><tr><td><div class="strong">AIF/MH/2026/03394</div><div class="mono">Nashik · Maharashtra</div></td><td><div class="strong">Sahyadri Packhouse LLP</div><div class="mono">Partnership</div></td><td>Integrated packhouse</td><td class="strong">₹1.10 Cr</td><td><span class="badge amber">Legal review</span></td><td>Day 4 / 7</td><td class="row-action">Open</td></tr><tr><td><div class="strong">AIF/KA/2026/03382</div><div class="mono">Mandya · Karnataka</div></td><td><div class="strong">Kaveri Farm Services</div><div class="mono">Private limited</div></td><td>Cold-chain expansion</td><td class="strong">₹88.00 L</td><td><span class="badge gray">Documents</span></td><td>Day 2 / 7</td><td class="row-action">Open</td></tr><tr><td><div class="strong">AIF/AP/2026/03361</div><div class="mono">Chittoor · Andhra Pradesh</div></td><td><div class="strong">Rythu Grading Centre</div><div class="mono">FPO</div></td><td>Grading and sorting line</td><td class="strong">₹46.00 L</td><td><span class="badge green">Memo ready</span></td><td>Day 5 / 7</td><td class="row-action">Open</td></tr></tbody></table></div></section></div>`}
function openCase(){state.screen="summary";render()}
function rSummary(){return `<div class="page"><div class="page-head"><div><div class="eyebrow">Declared application · before investigation</div><h1>Confirm the case Finclus is about to investigate</h1><p class="lede">This view contains borrower-declared facts and document completeness only. Findings remain hidden until the investigation is run.</p></div><div class="actions"><button class="btn" onclick="goGlobal('applications')">Return to queue</button><button class="btn primary" onclick="goCase('investigation')">${icons.arrow}Start investigation</button></div></div><div class="grid-2"><section class="panel"><div class="panel-head"><h3>Application facts</h3><span class="badge blue right">AIF eligibility to verify</span></div><div class="panel-body"><div class="facts"><div class="fact"><span>Legal entity</span><b>Producer company</b></div><div class="fact"><span>Operating vintage</span><b>${CASE.vintage}</b></div><div class="fact"><span>Project</span><b>${CASE.project}</b></div><div class="fact"><span>Location</span><b>${CASE.location}</b></div><div class="fact"><span>Total project cost</span><b>${CASE.cost}</b></div><div class="fact"><span>Term loan requested</span><b>${CASE.request}</b></div><div class="fact"><span>Promoter / member funds</span><b>₹47.50 L</b></div><div class="fact"><span>Farmer-members</span><b>${CASE.members}</b></div><div class="fact"><span>Operating model</span><b>Custom milling + by-products</b></div><div class="fact"><span>Declared security</span><b>Land, building and machinery</b></div></div><div class="consent"><b>Consent recorded before data access.</b> The synthetic journey includes separate AA consent and permissible-purpose bureau/registry pulls; these are not represented as one consent rail.</div></div></section><div class="stack"><section class="panel"><div class="panel-head"><h3>Document completeness</h3><span class="badge green right">28 of 30</span></div><div class="panel-body"><div class="doc-progress"><b>93%</b><span>2 items requested</span></div><div class="progress"><i style="width:93%"></i></div><div class="mini-list"><div class="mini-row"><span class="status-icon">✓</span>KYC and entity records<span class="end">8 / 8</span></div><div class="mini-row"><span class="status-icon">✓</span>Financial and tax records<span class="end">9 / 9</span></div><div class="mini-row"><span class="status-icon">✓</span>Project and quotations<span class="end">7 / 7</span></div><div class="mini-row"><span class="status-icon" style="background:var(--amber-soft);color:var(--amber)">!</span>Security and approvals<span class="end">4 / 6</span></div></div></div></section><div class="callout blue"><div><strong>What will run</strong>Seven bounded workstreams verify eligibility, KYC/AML, liabilities, financial integrity, security, project viability and policy. A critical integrity finding may pause the recommendation workflow.</div></div></div></div></div>`}
function rInvestigation(){const pct=Math.round(state.completed/WORKSTREAMS.length*100);return `<div class="page"><div class="page-head"><div><div class="eyebrow">Parallel evidence assembly</div><h1>${state.investigated?'Investigation complete':'Run the institutional investigation'}</h1><p class="lede">Each workstream has a bounded objective, named sources and an explicit escalation rule. Financial appraisal may continue after a referral; decision authority does not.</p></div><div class="actions">${state.investigated?'<button class="btn primary" onclick="goCase(\'findings\')">Review 4 findings</button>':`<button class="btn primary" ${state.running?'disabled':''} onclick="runInvestigation()">${icons.play}${state.running?'Running…':'Run 7 workstreams'}</button>`}</div></div>${state.investigated?'<div class="callout red" style="margin-bottom:14px"><div><strong>Decision workflow paused</strong>The financial-integrity workstream triggered a mandatory FCU referral. Appraisal outputs remain available for independent review; recommendation and sanction actions are blocked.</div></div>':''}<div class="run-top"><div class="run-progress"><div class="run-progress-label"><span>${state.running?'Workstreams running in parallel':state.investigated?'All workstreams completed':'Ready to run'}</span><b>${pct}%</b></div><div class="progress"><i style="width:${pct}%"></i></div></div></div><section class="panel workstreams">${WORKSTREAMS.map((w,i)=>{const done=i<state.completed||state.investigated;const running=state.running&&!done;return `<div class="stream"><span class="stream-no">0${i+1}</span><div class="stream-name">${w.name}</div><div class="stream-scope">${w.scope}</div><div class="stream-time">${done?w.time:'—'}</div><div class="stream-state">${done?`<span class="badge ${w.kind}">${w.result}</span>`:running?'<span class="spinner"></span>':'<span class="badge gray">Pending</span>'}</div></div>`}).join('')}</section></div>`}
function runInvestigation(){if(state.running||state.investigated)return;state.running=true;state.completed=0;render();const order=[1,0,2,4,5,3,6];let n=0;const timer=setInterval(()=>{state.completed=Math.min(WORKSTREAMS.length,state.completed+1);n++;if(n>=order.length){clearInterval(timer);state.running=false;state.investigated=true;state.completed=WORKSTREAMS.length;render();toast("<b>Investigation complete.</b> One critical integrity referral has paused the recommendation workflow.")}else render()},520)}
function rFindings(){return `<div class="page"><div class="page-head"><div><div class="eyebrow">Exception-led review</div><h1>Four findings need a human disposition</h1><p class="lede">Findings are ranked by decision impact. Open any row to inspect the source fact, provenance and system action.</p></div><div class="actions"><button class="btn" onclick="openEvidence('roundtrip')">Open critical evidence</button><button class="btn primary" onclick="goCase('appraisal')">Continue to appraisal</button></div></div><section class="panel"><div class="panel-head"><h3>Ranked findings</h3><span class="badge red right">1 critical · 3 review</span></div>${FINDINGS.map(f=>`<div class="finding"><span class="rank ${f.kind}">${f.rank}</span><div><div class="finding-title">${f.title}</div><div class="finding-desc">${f.desc}</div></div><div class="finding-source"><b>${f.source}</b><span class="badge ${f.kind}">${f.status}</span></div><button class="open-link" onclick="openEvidence('${f.id}')">View evidence →</button></div>`).join('')}</section><div class="callout" style="margin-top:14px"><div><strong>Control boundary</strong>Finclus can surface and explain the circular flow. It cannot classify fraud or clear the case. That determination belongs to the bank's Fraud Control Unit and named credit authority.</div></div></div>`}
const SCENARIOS={base:{name:"Base case",dscr:1.48,width:74,note:"Reconciled receipts and all known EMIs"},receipts:{name:"Receipts −10%",dscr:1.29,width:64.5,note:"Remains above 1.25× policy floor"},cost:{name:"Input cost +8%",dscr:1.21,width:60.5,note:"Falls below 1.25× policy floor"}};
function rAppraisal(){const s=SCENARIOS[state.stress];return `<div class="page"><div class="page-head"><div><div class="eyebrow">Independent appraisal · decision still on hold</div><h1>Test viability without clearing the integrity referral</h1><p class="lede">Appraisal continues so the officer has a complete view if the FCU later clears the case. Subsidy proceeds are not netted from project funding or exposure.</p></div><div class="actions"><button class="btn primary" onclick="goCase('decision')">Open decision state</button></div></div><div class="metric-row"><div class="metric"><div class="metric-label">Gross receipts FY26</div><div class="metric-value">₹4.20 Cr</div><div class="metric-note">GST declared ₹4.13 Cr</div></div><div class="metric"><div class="metric-label">Bank credits</div><div class="metric-value">₹4.05 Cr</div><div class="metric-note">3.6% reconciliation variance</div></div><div class="metric"><div class="metric-label">Total security FSV</div><div class="metric-value">₹1.10 Cr</div><div class="metric-note">1.52× requested facility</div></div><div class="metric"><div class="metric-label">Promoter / member funds</div><div class="metric-value">₹47.50 L</div><div class="metric-note">39.6% of project cost</div></div></div><div class="grid-half"><section class="panel"><div class="panel-head"><h3>Cash-flow stress</h3><div class="scenario-tabs right">${Object.entries(SCENARIOS).map(([id,x])=>`<button class="${state.stress===id?'on':''}" onclick="setStress('${id}')">${x.name}</button>`).join('')}</div></div><div class="panel-body"><div class="ratio-hero"><div><span>Minimum-year DSCR</span><br><b style="color:${s.dscr<1.25?'var(--red)':s.dscr<1.35?'var(--amber)':'var(--green)'}">${s.dscr.toFixed(2)}×</b></div><span>${s.note}</span></div><div class="ratio-track"><i style="width:${s.width}%;background:${s.dscr<1.25?'var(--red)':s.dscr<1.35?'var(--amber)':'var(--green)'}"></i><b class="ratio-floor"></b></div><div class="ratio-labels"><span>0×</span><span>Policy floor 1.25×</span><span>2×</span></div><table class="money-table" style="margin-top:16px"><tr><td>EBITDA margin</td><td>13.4%</td></tr><tr><td>Annual debt service</td><td>₹12.90 L</td></tr><tr><td>Break-even utilisation</td><td>61%</td></tr><tr><td>Integrity referral treatment</td><td>Excluded from viability conclusion</td></tr></table></div></section><section class="panel"><div class="panel-head"><h3>Security schedule</h3><span class="badge amber right">Prior charge open</span></div><div class="panel-body"><div class="security-list"><div class="security"><b>Land and building</b><span>FMV ₹1.06 Cr</span><span>FSV ₹82.0 L</span></div><div class="security"><b>Plant and machinery</b><span>FMV ₹35.0 L</span><span>FSV ₹28.0 L</span></div><div class="security"><b>Total security</b><span>FMV ₹1.41 Cr</span><span><b>FSV ₹1.10 Cr</b></span></div><div class="security"><b>Cover on request</b><span></span><span><b>1.52×</b></span></div></div><div class="callout red" style="margin-top:12px"><div><strong>Perfection blocked</strong>The cover is indicative until SBI's prior charge is satisfied and the panel advocate issues a final marketability opinion.</div></div></div></section></div></div>`}
function setStress(id){state.stress=id;render()}
function rDecision(){return `<div class="page"><div class="page-head"><div><div class="eyebrow">Human authority · hard control</div><h1>The system refuses to recommend sanction</h1><p class="lede">The case is appraised, but the unresolved circular-fund pattern prevents recommendation, checker approval and sanction.</p></div></div><div class="hold"><div class="hold-icon">${icons.stop}</div><div><h2>${state.referred?'Referred to Fraud Control Unit':'Recommendation withheld'}</h2><p>${state.referred?'Referral FCU/TG/2026/00142 is recorded. The decision workflow remains locked until a named investigator disposes the finding with evidence.':'Confidence is insufficient to classify fraud and the system is not permitted to infer intent. A named officer must refer the case for independent investigation.'}</p></div><span class="badge red">Hard hold</span></div><div class="decision-steps"><div class="decision-step done"><span class="step-no">01</span><h4>Appraisal complete</h4><p>Viability and security analysis assembled independently.</p></div><div class="decision-step current"><span class="step-no">02</span><h4>Integrity referral</h4><p>${state.referred?'Recorded · FCU/TG/2026/00142':'Officer action required before recommendation.'}</p></div><div class="decision-step blocked"><span class="step-no">03</span><h4>Maker recommendation</h4><p>Blocked until FCU disposition is attached.</p></div><div class="decision-step blocked"><span class="step-no">04</span><h4>Checker / sanction</h4><p>No action available while referral is open.</p></div></div><div class="grid-2" style="margin-top:14px"><section class="panel"><div class="panel-head"><h3>Required disposition</h3><span class="badge amber right">Named human owner</span></div><div class="panel-body"><div class="facts"><div class="fact"><span>Referral owner</span><b>Fraud Control Unit · Telangana</b></div><div class="fact"><span>Credit maker</span><b>R. Kumar</b></div><div class="fact"><span>Finding</span><b>₹41.0 L circular path</b></div><div class="fact"><span>Model confidence</span><b>0.58 · no classification</b></div><div class="fact"><span>Decision status</span><b style="color:var(--red)">Withheld</b></div><div class="fact"><span>Next permissible action</span><b>FCU referral</b></div></div><div class="actions" style="margin-top:14px"><button class="btn" onclick="openEvidence('roundtrip')">Review source</button><button class="btn danger" ${state.referred?'disabled':''} onclick="referFCU()">${state.referred?'Referral recorded':'Refer to FCU'}</button></div></div></section><section class="panel"><div class="panel-head"><h3>Maker–checker authority</h3></div><div class="panel-body"><div class="authority"><div class="authority-card"><span>Maker</span><b>R. Kumar</b><em>Referral authority</em></div><div class="authority-arrow">→</div><div class="authority-card" style="opacity:.55"><span>Checker</span><b>S. Menon</b><em>Blocked</em></div><div class="authority-arrow">→</div><div class="authority-card" style="opacity:.55"><span>Sanction</span><b>Credit committee</b><em>Blocked</em></div></div><button class="btn primary" disabled style="width:100%;margin-top:14px">Recommend sanction</button></div></section></div><div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn primary" onclick="goCase('audit')">Open audit reconstruction</button></div></div>`}
function referFCU(){state.referred=true;render();toast("<b>FCU referral recorded.</b> Recommendation, checker and sanction actions remain locked.")}
function rAudit(){return `<div class="page"><div class="page-head"><div><div class="eyebrow">Audit reconstruction</div><h1>From source evidence to named human action</h1><p class="lede">The bank can reconstruct what was observed, what rule applied, what the system refused to do and who owns the next decision.</p></div><div class="actions"><button class="btn" onclick="openEvidence('audit')">Open provenance record</button><button class="btn primary" onclick="goCase('pilot')">Close with pilot</button></div></div><div class="chain"><div class="chain-node"><div class="chain-label">Source</div><h4>AA bank statements</h4><p>Three consented accounts · synthetic source bundle · time stamped.</p></div><div class="chain-arrow">→</div><div class="chain-node"><div class="chain-label">Observed fact</div><h4>₹41.0 L circular path</h4><p>Three-hop path within seven days · common-director relationship.</p></div><div class="chain-arrow">→</div><div class="chain-node"><div class="chain-label">Control rule</div><h4>Do not classify intent</h4><p>Confidence 0.58 &lt; 0.85 · mandatory referral · recommendation withheld.</p></div><div class="chain-arrow">→</div><div class="chain-node human"><div class="chain-label">Human authority</div><h4>${state.referred?'R. Kumar referred to FCU':'R. Kumar action pending'}</h4><p>${state.referred?'Referral FCU/TG/2026/00142 · decision remains locked.':'Only the named maker can record the referral.'}</p></div></div><section class="panel audit-list"><div class="panel-head"><h3>Case event trail</h3><span class="badge gray right">Synthetic · reconstructable</span></div><div class="panel-body">${[["09:14:02","consent.recorded","AA purpose and duration recorded","EVT-011"],["09:14:18","bureau.reconcile","₹6.0 L undeclared liability surfaced","EVT-026"],["09:14:41","integrity.observe","Circular path observed · confidence 0.58","EVT-044"],["09:14:42","policy.enforce","Recommendation workflow locked","EVT-045"],["09:14:53","legal.review","Title gap and prior charge routed","EVT-051"],["09:15:12","appraisal.complete","Independent appraisal stored","EVT-068"],["09:16:03","human.action",state.referred?"FCU referral recorded by R. Kumar":"FCU referral pending","EVT-073"]].map(x=>`<div class="audit-event"><span>${x[0]}</span><b>${x[1]}</b><span>${x[2]}</span><span class="event-id">${x[3]}</span></div>`).join('')}</div></section></div>`}
function rPilot(){return `<div class="page pilot-shell"><div class="pilot-title"><div class="eyebrow">Measured experiment · not an MoU</div><h1>Prove value on the bank's own files</h1><p>Run one bounded 90-day pilot against historical and shadow-mode applications. Scale only if accuracy, control and officer productivity improve.</p></div><div class="pilot-grid"><div class="pilot-card"><span class="num">01 · SCOPE</span><h3>One state · one product</h3><p>AIF term lending in Telangana, with the bank's credit policy, scheme rules, panel formats and authority matrix versioned for the pilot.</p></div><div class="pilot-card"><span class="num">02 · SAMPLE</span><h3>100 historical files</h3><p>Back-test on known outcomes, then run in shadow mode on live applications. No automated credit decision or customer communication.</p></div><div class="pilot-card"><span class="num">03 · CONTROL</span><h3>Named human authority</h3><p>Every exception has an owner. Overrides, challenges, referrals and source lineage are captured for independent validation.</p></div></div><div class="measures"><div class="panel-head" style="padding:0;border-bottom:1px solid var(--line);margin-bottom:14px"><h3>Measure before deciding to scale</h3></div><div class="measure-row"><div class="measure"><b>CAM preparation time</b><span>Baseline vs pilot</span></div><div class="measure"><b>Exception precision</b><span>Officer-confirmed</span></div><div class="measure"><b>Material misses</b><span>False-negative review</span></div><div class="measure"><b>Override quality</b><span>Reason and outcome</span></div><div class="measure"><b>Audit reconstruction</b><span>Time to evidence</span></div></div></div><div style="display:flex;justify-content:center;gap:8px;margin-top:18px"><button class="btn" onclick="goCase('audit')">Back to audit</button><button class="btn primary" onclick="toast('<b>Pilot outline ready.</b> One state, one product, 100 historical files, 90 days.')">Record pilot scope</button></div></div>`}
function openEvidence(id){const e=EVIDENCE[id];if(!e)return;document.getElementById("drawer").innerHTML=`<div class="drawer-head"><div><h3>${e.title}</h3><p>${e.sub}</p></div><button class="drawer-close" onclick="closeDrawer()" aria-label="Close">×</button></div><div class="drawer-body"><div class="source-card"><div class="source-title">Source record</div><div class="source-meta">${e.source}</div><div class="source-rows">${e.rows.map(r=>`<div class="source-row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div></div><div class="provenance">SOURCE <b>${e.source}</b><br>CONSENT / BASIS <b>${e.consent}</b><br>EVENT <b>${e.event}</b><br>CASE <b>${CASE.id}</b><br>DATA CLASS <b>SYNTHETIC WORKSHOP DEMO</b></div><div class="drawer-note"><b>Human control:</b> this record supports an investigation referral. It does not establish fraudulent intent or authorize a credit decision.</div></div>`;document.getElementById("drawer").classList.add("on");document.getElementById("overlay").classList.add("on")}
function closeDrawer(){document.getElementById("drawer").classList.remove("on");document.getElementById("overlay").classList.remove("on")}
function toast(html){const host=document.getElementById("toastHost"),el=document.createElement("div");el.className="toast";el.innerHTML=html;host.appendChild(el);setTimeout(()=>el.remove(),4000)}
function openSearch(){document.getElementById("searchDialog").classList.add("on");setTimeout(()=>document.getElementById("searchInput").focus(),20)}function closeSearch(){document.getElementById("searchDialog").classList.remove("on")}
document.addEventListener("keydown",e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"");if(e.key==="Escape"){closeDrawer();closeSearch()}if(e.key==="/"&&!typing){e.preventDefault();openSearch()}if(e.key.toLowerCase()==="r"&&!typing){resetDemo()}if(!typing&&state.screen!=="applications"&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){const ids=TABS.map(x=>x[0]),i=ids.indexOf(state.screen),n=e.key==="ArrowRight"?i+1:i-1;if(n>=0&&n<ids.length)goCase(ids[n])}});
render();
</script>
</body>
</html>
